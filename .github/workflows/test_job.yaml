name: Artifact Sharing Example

on: [workflow_dispatch]

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Create a file to share
        run: date+%s > shared-file.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: shared-artifact
          path: shared-file.txt

  download-artifact:
    runs-on: ubuntu-latest
    needs: upload-artifact  # This makes sure download waits for upload to complete
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: shared-artifact

      - name: Show file content
        run: cat shared-file.txt
