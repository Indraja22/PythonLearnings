name: Test Job
on:
  workflow_dispatch:
jobs:
  generate-file:
    runs-on: ubuntu-latest
    steps:
      - name: Generate file
        run: echo date +%s > file.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: daily-file
          path: file.txt
          retention-days: 2  # Keep it for 2 days (adjust as needed)
  use-file:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous day's file
        uses: actions/download-artifact@v3
        with:
          name: daily-file
          path: ./previous-file

      - name: Use the file
        run: cat ./previous-file/file.txt        
